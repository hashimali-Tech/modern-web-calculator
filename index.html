<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="code.js" defer></script> 

    </head> 


<div class="background-glow"></div>
<div class="background-glow2"></div>

<div class="calculator">

    <div class="top-bar">
        <h1>Scientific</h1>
        <button class="theme-btn" onclick="toggleTheme()">☀</button>
    </div>

    <div class="screen">
        <input type="text" class="input-screen" id="inputScreen" readonly>
        <input type="text" class="output-screen" id="outputScreen" readonly>
    </div>

    <div class="buttons">

        <button class="clear" onclick="clearAll()">AC</button>
        <button onclick="deleteLast()">DEL</button>
        <button onclick="appendValue('%')">%</button>
        <button class="operator" onclick="appendValue('/')">÷</button>
        <button class="operator" onclick="appendValue('**')">^</button>

        <button class="special" onclick="appendFunction('Math.sin(')">sin</button>
        <button class="special" onclick="appendFunction('Math.cos(')">cos</button>
        <button class="special" onclick="appendFunction('Math.tan(')">tan</button>
        <button class="special" onclick="appendFunction('Math.sqrt(')">√</button>
        <button class="special" onclick="appendFunction('Math.log10(')">log</button>

        <button class="special" onclick="appendFunction('Math.log(')">ln</button>
        <button onclick="appendValue('3.141592')">π</button>
        <button onclick="appendValue('2.71828')">e</button>
        <button onclick="appendValue('(')">(</button>
        <button onclick="appendValue(')')">)</button>

        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('*')">×</button>
        <button class="special" onclick="squareValue()">x²</button>

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('-')">−</button>
        <button class="special" onclick="factorial()">x!</button>

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button class="operator" onclick="appendValue('+')">+</button>
        <button onclick="appendValue('.')">.</button>

        <button onclick="appendValue('0')">0</button>
        <button onclick="appendValue('00')">00</button>
        <button class="equal" onclick="calculate()">=</button>

    </div>

    <div class="history-box">
        <h3>History</h3>
        <div id="history"></div>
    </div>

</div>

<script src="code.js"></script>

</body>

</html>
